name: edulabs-staging
x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
x-safety: &safety
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logs
  stop_grace_period: 45s
services:
  app:
    <<: *safety
    image: ${EDULABS_IMAGE:?Set immutable web image tag}
    env_file: ${WEB_ENV_FILE:?Set protected runtime environment file}
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      NEXT_PUBLIC_AUTH_BACKEND: firebase-staging
      LMS_DATA_BACKEND: supabase-staging
    secrets:
      - source: firebase_admin
        target: firebase-admin.json
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777", "/app/.next/cache:uid=10001,gid=10001,size=256m"]
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.5
    pids_limit: 200
    networks: [backend]
  caddy:
    <<: *safety
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["${HTTPS_BIND:-127.0.0.1}:443:443", "${HTTPS_BIND:-127.0.0.1}:80:80"]
    env_file: ${CADDY_ENV_FILE:?Set protected private-gate settings}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
    cpus: 0.5
    pids_limit: 100
    depends_on: { app: { condition: service_healthy } }
    networks: [backend]
  notification-worker:
    <<: *safety
    profiles: [notifications]
    image: ${EDULABS_WORKER_IMAGE:-edulabs-worker:disabled}
    env_file:
      - path: ${WORKER_ENV_FILE:-/etc/edulabs/worker.env}
        required: false
    environment:
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/notification-worker-key
    secrets:
      - source: notification_worker_key
        target: notification-worker-key
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 60s
    networks: [backend]
networks:
  backend: {}
volumes:
  caddy_data: {}
  caddy_config: {}
secrets:
  firebase_admin:
    file: ${FIREBASE_ADMIN_FILE:?Set protected Firebase credential path}
  notification_worker_key:
    file: ${NOTIFICATION_WORKER_KEY_FILE:-/etc/edulabs/notification-worker.key}
